version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: agriassist-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: agriassist
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: agriassist-api
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@mysql:3306/agriassist
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=supersecretkeychangeinproduction1234567890
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
    container_name: agriassist-ui
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
